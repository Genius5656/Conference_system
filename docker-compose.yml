# Локальный PostgreSQL для разработки портала «Конференции.РФ».
# Запуск: docker compose up -d
# Остановка: docker compose down  (данные сохраняются в томе pgdata)

services:
  postgres:
    image: postgres:16-alpine
    container_name: conference_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conference_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conference_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
